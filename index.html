  <!-- الخطوط الحديثة: Cairo مع خط النظام اللاتيني للأرقام -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       Design System & Tokens (2026 Modern Automotive Detailing App Aesthetic)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* لوحة الألوان الأساسية: Deep Obsidian Navy */
      --bg-base: #0B0F17;
      --bg-surface: #111622;
      --bg-surface-elevated: #161D2C;
      --bg-card: rgba(22, 27, 38, 0.75);
      --bg-card-hover: rgba(28, 35, 49, 0.9);
      
      /* ألوان الهوية والحالة */
      --brand-red: #E11D48;
      --brand-red-hover: #BE123C;
      --brand-red-glow: rgba(225, 29, 72, 0.28);
      --brand-red-subtle: rgba(225, 29, 72, 0.12);
      
      --accent-gold: #D4AF37;
      --accent-gold-subtle: rgba(212, 175, 55, 0.12);
      --wa-green: #22C55E;
      --wa-green-hover: #16A34A;
      --wa-green-glow: rgba(34, 197, 94, 0.25);
      --wa-green-subtle: rgba(34, 197, 94, 0.12);
      
      /* ألوان النصوص والتباين */
      --text-white: #FFFFFF;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      
      /* إطارات الزجاج المصقول (Glassmorphism Borders) */
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glass-top: rgba(255, 255, 255, 0.18);
      --border-medium: rgba(255, 255, 255, 0.14);
      --border-active: rgba(225, 29, 72, 0.4);
      
      /* أنصاف الأقطار والانحناءات العصرية */
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      
      /* الظلال الناعمة */
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 12px 30px -5px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 24px 45px -10px rgba(0, 0, 0, 0.7);
      --shadow-red: 0 12px 35px -5px var(--brand-red-glow);
      
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-base: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      line-height: 1.65;
      direction: rtl;
      text-align: right;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img, video {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition-fast);
    }

    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
      background: none;
      transition: var(--transition-fast);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* عزل اتجاه الأرقام والهواتف عن تداخل النص العربي */
    .ltr-data {
      direction: ltr !important;
      unicode-bidi: isolate !important;
      display: inline-block;
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 700;
    }

    /* حاضنة الأيقونات الزجاجية المربعة المنحنية (52x52px) */
    .icon-glass-box {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass-top);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-white);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .icon-glass-box.sm {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
    }

    .icon-glass-box.red-glow {
      background: var(--brand-red-subtle);
      border-color: rgba(225, 29, 72, 0.35);
      color: #FF5A76;
    }

    .icon-glass-box.green-glow {
      background: var(--wa-green-subtle);
      border-color: rgba(34, 197, 94, 0.35);
      color: var(--wa-green);
    }

    .icon-glass-box.gold-glow {
      background: var(--accent-gold-subtle);
      border-color: rgba(212, 175, 55, 0.35);
      color: var(--accent-gold);
    }

    /* نمط الأيقونات الموحد بدقة 1.8px Stroke */
    .svg-icon {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .svg-icon-sm { width: 17px; height: 17px; }
    .svg-icon-lg { width: 28px; height: 28px; }

    /* وسوم العناوين المصقولة (Pills) */
    .title-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #FF5A76;
      background: var(--brand-red-subtle);
      border: 1px solid rgba(225, 29, 72, 0.3);
      padding: 5px 16px;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .main-title {
      font-size: clamp(1.85rem, 3.8vw, 2.6rem);
      font-weight: 900;
      color: var(--text-white);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .sub-title {
      color: var(--text-secondary);
      font-size: 1.05rem;
      max-width: 620px;
      margin: 0 auto;
      line-height: 1.65;
    }

    .section-block {
      padding: 80px 0;
      position: relative;
    }

    /* ==========================================================================
       Header (Modern Glassmorphic Sticky Navbar)
       ========================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      width: 100%;
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 0;
      z-index: 1000;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo-img {
      height: 40px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
    }

    .header-call-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass-top);
      color: var(--text-white);
      padding: 9px 18px;
      border-radius: var(--radius-full);
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    .header-call-btn:hover {
      background: var(--brand-red);
      border-color: var(--brand-red);
      transform: translateY(-2px);
      box-shadow: var(--shadow-red);
    }

    /* ==========================================================================
       Hero Section (Modern Automotive Detailing App)
       ========================================================================== */
    .hero-banner {
      position: relative;
      width: 100%;
      min-height: 84vh;
      display: flex;
      align-items: center;
      padding: 60px 0 75px 0;
      overflow: hidden;
      background-color: var(--bg-base);
    }

    .hero-bg-visual {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .hero-backdrop-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      filter: brightness(0.35) contrast(1.1);
      z-index: 1;
    }

    .hero-bg-visual video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .hero-bg-visual video.video-active {
      opacity: 1;
      pointer-events: auto;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      background: linear-gradient(180deg, rgba(11, 15, 23, 0.45) 0%, rgba(11, 15, 23, 0.8) 65%, var(--bg-base) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 4;
      width: 100%;
      max-width: 820px;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(17, 22, 34, 0.85);
      border: 1px solid var(--border-glass-top);
      color: var(--text-white);
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 22px;
      backdrop-filter: blur(12px);
    }

    .hero-tag-icon { color: var(--brand-red); }

    .hero-heading {
      font-size: clamp(2.3rem, 5.8vw, 4rem);
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 18px;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.85);
    }

    .hero-heading span {
      background: linear-gradient(135deg, #FF4D6D 0%, #E11D48 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtext {
      font-size: 1.15rem;
      color: var(--text-secondary);
      margin-bottom: 30px;
      line-height: 1.85;
      max-width: 680px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .hero-play-controller {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: rgba(22, 27, 38, 0.85);
      border: 1px solid var(--border-glass-top);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 22px 10px 14px;
      border-radius: var(--radius-full);
      color: var(--text-white);
      cursor: pointer;
      margin-bottom: 28px;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(16px);
      transition: var(--transition-base);
    }

    .hero-play-controller:hover {
      transform: translateY(-2px);
      background: rgba(28, 35, 49, 0.95);
      box-shadow: var(--shadow-red);
    }

    .play-icon-pulse {
      width: 44px;
      height: 44px;
      background: var(--brand-red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-white);
      box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.6);
      animation: red-pulse 2.2s infinite;
      flex-shrink: 0;
    }

    @keyframes red-pulse {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }

    .play-text-wrap {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .play-text-wrap strong {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-white);
      line-height: 1.25;
    }

    .play-text-wrap span {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .branches-quick-strip {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hero-branch-pill {
      background: rgba(22, 27, 38, 0.75);
      border: 1px solid var(--border-subtle);
      border-top: 1px solid var(--border-glass-top);
      border-radius: var(--radius-full);
      padding: 10px 18px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(12px);
      transition: var(--transition-fast);
      color: var(--text-white);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .hero-branch-pill:hover {
      background: rgba(28, 35, 49, 0.9);
      border-color: var(--border-active);
      transform: translateY(-2px);
    }

    .hero-branch-pill .mini-badge {
      background: var(--brand-red-subtle);
      color: #FF5A76;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-weight: 800;
    }

    /* ==========================================================================
       Bento Grid Features Section (Modern Layout 2026)
       ========================================================================== */
    .bento-section {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }

    .bento-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 24px;
    }

    .bento-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 1px solid var(--border-glass-top);
      border-radius: var(--radius-lg);
      padding: 34px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: var(--transition-base);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .bento-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    /* الكرت الرئيسي العريض في البينتو */
    .bento-hero {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 32px;
      align-items: center;
      background: linear-gradient(135deg, rgba(28, 35, 49, 0.85) 0%, rgba(17, 22, 34, 0.95) 100%);
      border: 1px solid rgba(225, 29, 72, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.5), 0 0 25px -5px var(--brand-red-glow);
    }

    .bento-hero-info h3 {
      font-size: clamp(1.4rem, 2.5vw, 1.85rem);
      font-weight: 900;
      color: var(--text-white);
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .bento-hero-info p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.75;
      margin-bottom: 20px;
    }

    .bento-features-list {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .bento-feature-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .bento-hero-badge-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(11, 15, 23, 0.6);
      border: 1px solid var(--border-glass-top);
      border-radius: var(--radius-md);
      padding: 24px;
    }

    .bento-hero-badge-wrap .icon-glass-box {
      margin-bottom: 12px;
    }

    .bento-hero-badge-wrap strong {
      font-size: 1.05rem;
      color: var(--text-white);
      margin-bottom: 4px;
    }

    .bento-hero-badge-wrap span {
      font-size: 0.84rem;
      color: var(--text-secondary);
    }

    /* الكرتان المريحان تحت الكرت العريض */
    .bento-card-compact {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .bento-card-compact .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .bento-card-compact h4 {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 6px;
    }

    .bento-card-compact p {
      color: var(--text-secondary);
      font-size: 0.94rem;
      line-height: 1.7;
    }

    .bento-tag {
      font-size: 0.76rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    /* ==========================================================================
       Pricing Section (Fixed Currency Bug & Refined Cards)
       ========================================================================== */
    .official-pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .official-price-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 1px solid var(--border-glass-top);
      border-radius: var(--radius-lg);
      padding: 36px 26px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: var(--transition-base);
    }

    .official-price-card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .official-price-card.featured {
      border: 1px solid rgba(225, 29, 72, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(180deg, rgba(28, 35, 49, 0.95) 0%, rgba(22, 27, 38, 0.8) 100%);
      box-shadow: var(--shadow-red);
    }

    .car-category-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 16px;
      border-radius: var(--radius-full);
      margin-bottom: 16px;
    }

    .official-price-card.featured .car-category-badge {
      background: var(--brand-red);
      color: var(--text-white);
    }

    .car-category-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 6px;
    }

    .car-service-label {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .pricing-points-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--brand-red-subtle);
      border: 1px solid rgba(225, 29, 72, 0.3);
      color: #FF5A76;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      margin-bottom: 20px;
    }

    /* تصحيح إظهار العملة بجانب الرقم بوضوح */
    .car-price-number-wrap {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .car-price-number {
      font-size: 3.8rem;
      font-weight: 900;
      color: var(--text-white);
      line-height: 1;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .car-price-currency {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--brand-red);
    }

    .btn-order-category {
      background: var(--brand-red);
      color: var(--text-white);
      padding: 13px 20px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 0.94rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.3);
    }

    .btn-order-category:hover {
      background: var(--brand-red-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-red);
    }

    /* ==========================================================================
       Apple Wallet Loyalty Pass Section
       ========================================================================== */
    .loyalty-section {
      background: radial-gradient(circle at 80% 20%, #1A2436 0%, var(--bg-surface) 75%);
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
      overflow: hidden;
    }

    .loyalty-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      align-items: center;
    }

    .loyalty-pass-card {
      background: linear-gradient(145deg, #131A26 0%, #0A0D14 100%);
      border: 1px solid rgba(225, 29, 72, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.7), 0 0 30px -5px var(--brand-red-glow);
      position: relative;
      transition: var(--transition-base);
    }

    .loyalty-pass-card:hover {
      transform: translateY(-4px);
      border-color: var(--brand-red);
      box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.8), 0 0 40px var(--brand-red-glow);
    }

    .pass-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .pass-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pass-logo {
      height: 32px;
      width: auto;
      max-width: 110px;
      object-fit: contain;
    }

    .pass-type-badge {
      background: var(--brand-red-subtle);
      border: 1px solid rgba(225, 29, 72, 0.4);
      color: #FF5A76;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .pass-stamps-wrap {
      margin-bottom: 22px;
    }

    .stamps-title {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .stamp-slot {
      aspect-ratio: 1;
      background: var(--bg-surface);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      transition: var(--transition-fast);
      padding: 6px;
    }

    .stamp-slot.active {
      border-style: solid;
      border-color: var(--brand-red);
      background: var(--brand-red-subtle);
      box-shadow: 0 0 15px rgba(225, 29, 72, 0.3);
    }

    .stamp-slot.gift {
      border-color: var(--accent-gold);
      background: var(--accent-gold-subtle);
    }

    .stamp-slot.gift.active {
      background: rgba(212, 175, 55, 0.2);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }

    .stamp-number {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .stamp-slot.active .stamp-number {
      color: var(--brand-red);
    }

    .stamp-slot.gift .stamp-number {
      color: var(--accent-gold);
    }

    .pass-footer-strip {
      background: rgba(0, 0, 0, 0.45);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .pass-barcode-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: monospace;
      color: var(--text-white);
      font-weight: 700;
    }

    .loyalty-details h3 {
      font-size: clamp(1.8rem, 3.5vw, 2.4rem);
      font-weight: 900;
      color: var(--text-white);
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .loyalty-details h3 span {
      background: linear-gradient(135deg, #FF4D6D, #E11D48);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .loyalty-desc {
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .loyalty-perks {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .loyalty-perks li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .btn-apple-wallet {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #000000;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      padding: 12px 26px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: var(--transition-fast);
      text-decoration: none;
    }

    .btn-apple-wallet:hover {
      background: #111111;
      border-color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
    }

    .apple-wallet-icon-svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .apple-wallet-texts {
      display: flex;
      flex-direction: column;
      text-align: right;
    }

    .apple-wallet-sub {
      font-size: 0.72rem;
      color: #A1A1A6;
      line-height: 1;
      margin-bottom: 2px;
    }

    .apple-wallet-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.1;
    }

    /* ==========================================================================
       Services Cards (Classic, Royal, Wax)
       ========================================================================== */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    .service-box {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 1px solid var(--border-glass-top);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: var(--transition-base);
    }

    .service-box:hover {
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .service-cover {
      position: relative;
      height: 220px;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-surface-elevated);
    }

    .service-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .service-box:hover .service-cover img {
      transform: scale(1.05);
    }

    .classic-car-view {
      object-position: center 85% !important;
    }

    .service-info {
      padding: 26px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .service-info h3 {
      font-size: 1.32rem;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 8px;
    }

    .service-info p {
      color: var(--text-secondary);
      font-size: 0.94rem;
      line-height: 1.75;
      margin-bottom: 22px;
      flex-grow: 1;
    }

    .service-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background: var(--wa-green-subtle);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: var(--wa-green);
      padding: 12px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      font-size: 0.94rem;
    }

    .service-btn:hover {
      background: var(--wa-green);
      color: var(--text-white);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }

    /* ==========================================================================
       Interactive Branches Section (iOS Segmented Control & Spacious Card)
       ========================================================================== */
    .branches-section {
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }

    /* شريط التبديل الكبسولي بنمط iOS */
    .segmented-control-wrapper {
      max-width: 580px;
      margin: 0 auto 36px auto;
      background: rgba(11, 15, 23, 0.8);
      border: 1px solid var(--border-glass-top);
      border-radius: var(--radius-full);
      padding: 6px;
      display: flex;
      position: relative;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
    }

    .segment-btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: var(--radius-full);
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    .segment-btn.active {
      color: var(--text-white);
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.95), rgba(190, 18, 60, 0.95));
      box-shadow: 0 4px 18px var(--brand-red-glow);
    }

    /* كرت الفرع الفسيح الموحد */
    .branch-unified-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 1px solid var(--border-glass-top);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: var(--transition-base);
    }

    .branch-photo-holder {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 380px;
      overflow: hidden;
      background-color: var(--bg-surface-elevated);
    }

    .branch-photo-holder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s ease, transform 0.6s ease;
    }

    .branch-photo-holder:hover img {
      transform: scale(1.03);
    }

    .branch-unified-content {
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .branch-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: var(--wa-green);
      font-size: 0.85rem;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      margin-bottom: 16px;
      width: fit-content;
    }

    .status-dot-pulse {
      width: 8px;
      height: 8px;
      background: var(--wa-green);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
      animation: green-pulse 2s infinite;
    }

    @keyframes green-pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .branch-title {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--text-white);
      margin-bottom: 6px;
    }

    .branch-location-text {
      color: #FF5A76;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
    }

    /* تنظيم أوقات الدوام */
    .hours-organized-box {
      background: rgba(11, 15, 23, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 22px;
    }

    .hours-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-white);
      margin-bottom: 10px;
    }

    .hours-periods {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .period-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .period-line strong {
      color: var(--text-white);
      font-family: system-ui, sans-serif;
    }

    .branch-features-strip {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .branch-unified-actions {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 14px;
    }

    .btn-branch-map {
      background: var(--text-white);
      color: var(--bg-base);
      padding: 13px 20px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: var(--shadow-sm);
    }

    .btn-branch-map:hover {
      background: #E2E8F0;
      transform: translateY(-2px);
    }

    .btn-branch-wa {
      background: var(--wa-green-subtle);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: var(--wa-green);
      padding: 13px 20px;
      border-radius: var(--radius-sm);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-branch-wa:hover {
      background: var(--wa-green);
      color: var(--text-white);
      transform: translateY(-2px);
    }

    /* ==========================================================================
       CTA Banner & Footer
       ========================================================================== */
    .cta-banner {
      background: radial-gradient(circle at 50% 50%, #1A2333 0%, var(--bg-surface) 100%);
      border-top: 1px solid rgba(225, 29, 72, 0.3);
      padding: 65px 0;
      text-align: center;
    }

    .cta-banner h2 {
      font-size: clamp(2rem, 4vw, 2.6rem);
      font-weight: 900;
      color: var(--text-white);
      margin-bottom: 10px;
    }

    .cta-banner p {
      color: var(--text-secondary);
      font-size: 1.15rem;
      margin-bottom: 30px;
    }

    .banner-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-banner-wa {
      background: var(--wa-green);
      color: var(--text-white);
      padding: 14px 30px;
      border-radius: var(--radius-full);
      font-weight: 800;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px var(--wa-green-glow);
    }

    .btn-banner-wa:hover {
      background: var(--wa-green-hover);
      transform: translateY(-2px);
    }

    .btn-banner-phone {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass-top);
      color: var(--text-white);
      padding: 14px 30px;
      border-radius: var(--radius-full);
      font-weight: 800;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-banner-phone:hover {
      background: var(--text-white);
      color: var(--bg-base);
      transform: translateY(-2px);
    }

    .footer {
      background: #070A0F;
      padding: 55px 0 24px 0;
      border-top: 1px solid var(--border-subtle);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 2fr 1.5fr;
      gap: 36px;
      padding-bottom: 36px;
    }

    .footer-logo {
      max-height: 44px;
      margin-bottom: 14px;
    }

    .footer h4 {
      font-size: 1.15rem;
      color: #FF5A76;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .footer p {800;
      margin-bottom: 14px;
    }

    .footer p {
      color: var(--text-secondary);
      font-size: 0.94rem;
      margin-bottom: 10px;
      line-height: 1.7;
    }

    .footer-copy {
      border-top: 1px solid var(--border-subtle);
      padding-top: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* زر واتساب العائم الفاخر */
    .floating-wa {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 24px;
      width: 58px;
      height: 58px;
      background: var(--wa-green);
      color: var(--text-white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px var(--wa-green-glow);
      z-index: 9999;
      transition: var(--transition-fast);
    }

    .floating-wa:hover {
      transform: scale(1.08);
      background: var(--wa-green-hover);
    }

    .floating-wa .svg-icon {
      width: 30px;
      height: 30px;
    }

    /* ==========================================================================
       Responsive Media Queries (Mobile & Tablet)
       ========================================================================== */
    @media (max-width: 992px) {
      .bento-grid {
        grid-template-columns: 1fr;
      }
      .bento-hero {
        grid-template-columns: 1fr;
      }
      .official-pricing-grid,
      .services-grid,
      .footer-grid {
        grid-template-columns: 1fr;
      }
      .branch-unified-card {
        grid-template-columns: 1fr;
      }
      .branch-photo-holder {
        min-height: 250px;
      }
      .loyalty-grid {
        grid-template-columns: 1fr;
        gap: 32px;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 0 16px !important;
      }

      .section-block {
        padding: 44px 0 !important;
      }

      .section-title {
        margin-bottom: 26px !important;
      }

      .title-pill {
        font-size: 0.78rem !important;
        padding: 4px 12px !important;
      }

      .main-title {
        font-size: 1.65rem !important;
        line-height: 1.3 !important;
      }

      .sub-title {
        font-size: 0.92rem !important;
      }

      /* الشريط العلوي */
      .site-header {
        padding: 10px 0 !important;
      }

      .brand-logo-img {
        height: 34px !important;
        max-width: 120px !important;
      }

      .header-call-btn {
        padding: 7px 14px !important;
        font-size: 0.82rem !important;
      }

      /* الهيرو */
      .hero-banner {
        min-height: auto !important;
        padding: 28px 0 38px 0 !important;
      }

      .hero-heading {
        font-size: 2rem !important;
        margin-bottom: 12px !important;
      }

      .hero-subtext {
        font-size: 0.94rem !important;
        margin-bottom: 20px !important;
      }

      .hero-play-controller {
        width: 100% !important;
        padding: 10px 16px !important;
        margin-bottom: 20px !important;
      }

      /* بينتو جريد */
      .bento-card {
        padding: 22px 18px !important;
      }

      .bento-features-list {
        gap: 10px !important;
      }

      /* الأسعار */
      .official-pricing-grid {
        gap: 14px !important;
      }

      .official-price-card {
        padding: 22px 18px !important;
      }

      .car-price-number {
        font-size: 3rem !important;
      }

      /* كرت الفرع */
      .branch-unified-content {
        padding: 22px 18px !important;
      }

      .branch-title {
        font-size: 1.35rem !important;
      }

      .branch-unified-actions {
        grid-template-columns: 1fr !important;
      }

      .btn-branch-map, .btn-branch-wa {
        width: 100% !important;
      }

      /* بطاقة المحفظ
